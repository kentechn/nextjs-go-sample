openapi: 3.0.3
info:
  title: nextjs-go-sample API
  version: 0.1.0
  description: |
    Single source of truth for the HTTP contract between apps/web (Next.js) and
    apps/api (Go). Both the Go server interfaces and the TypeScript types are
    generated from this file; never edit generated code by hand.
servers:
  - url: http://localhost:8080
    description: Local API server
tags:
  - name: system
  - name: todos
paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness probe
      responses:
        "200":
          description: The service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /todos:
    get:
      operationId: listTodos
      tags: [todos]
      summary: List todos
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by completion status
          schema:
            $ref: "#/components/schemas/TodoStatus"
      responses:
        "200":
          description: A list of todos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTodo
      tags: [todos]
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTodoRequest"
      responses:
        "201":
          description: The created todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /todos/{todoId}:
    parameters:
      - $ref: "#/components/parameters/TodoId"
    get:
      operationId: getTodo
      tags: [todos]
      summary: Get a todo by id
      responses:
        "200":
          description: The requested todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTodo
      tags: [todos]
      summary: Delete a todo
      responses:
        "204":
          description: The todo was deleted
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    TodoId:
      name: todoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: An error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: 0.1.0
    TodoStatus:
      type: string
      enum: [all, open, done]
      default: all
    Todo:
      type: object
      required: [id, title, done, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        done:
          type: boolean
        createdAt:
          type: string
          format: date-time
    TodoList:
      type: object
      required: [todos]
      properties:
        todos:
          type: array
          items:
            $ref: "#/components/schemas/Todo"
    CreateTodoRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string
