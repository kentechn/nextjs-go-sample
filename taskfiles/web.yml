version: "3"

tasks:
  dev:
    desc: Next.js dev サーバ (:3000)
    cmds:
      - pnpm --filter web dev

  build:
    desc: Next.js を本番ビルド
    cmds:
      - pnpm --filter web build

  start:
    desc: ビルド済みの Next.js を起動
    cmds:
      - pnpm --filter web start

  gen:
    desc: openapi-typescript で API 型を生成
    cmds:
      - pnpm run gen:api

  lint:
    desc: Biome で lint / format チェック
    cmds:
      - pnpm run lint

  fmt:
    desc: Biome で自動修正
    cmds:
      - pnpm run lint:fix

  typecheck:
    desc: tsc による型チェック
    cmds:
      - pnpm run typecheck

  storybook:
    desc: Storybook (:6006)
    cmds:
      - pnpm --filter web storybook

  storybook:build:
    desc: Storybook を静的ビルド
    cmds:
      - pnpm run build-storybook
