name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.26.6"
  TASK_VERSION: "3.52.0"

jobs:
  frontend:
    name: Frontend (biome / typecheck / build / storybook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: task app:web:lint
      - run: task app:web:typecheck
      - run: task app:web:build
      - run: task app:storybook:build

  backend:
    name: Backend (golangci-lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - run: task app:api:build
      - run: task app:api:test
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/api

  docs:
    name: OpenAPI (redocly lint / build-docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: task docs:lint
      - run: task docs:build
      - run: task docs:bundle
      - uses: actions/upload-artifact@v5
        with:
          name: openapi-docs
          path: docs/api
          retention-days: 7

  codegen:
    name: Codegen is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: task gen:check

  docker:
    name: Docker images (buildx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build api / web images
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: api,web
          set: |
            *.output=type=cacheonly
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: task app:e2e:install
      - run: task app:web:build
      - run: task app:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
